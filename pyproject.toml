[project]
name = "yuanli"
version = "3.0.0"
description = "原力OS kernel: one append-only ledger, one decision loop, pluggable domain apps (健康/投研/创业/内容)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
brain = ["anthropic"]
dev = ["pytest>=8"]

[project.scripts]
yuanli = "yuanli.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["yuanli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
